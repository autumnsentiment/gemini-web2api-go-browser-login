services:
  image-gen-plugin:
    image: nginx:stable-alpine
    container_name: new-api-image-gen
    restart: always
    ports:
      - "4010:4010"
    volumes:
      - ./image-gen.html:/usr/share/nginx/html/image-gen.html:ro
      - ./image-gen-plugin.js:/usr/share/nginx/html/image-gen-plugin.js:ro
      - ./image-gen-plugin.css:/usr/share/nginx/html/image-gen-plugin.css:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - new-api-network

networks:
  new-api-network:
    external: true
    name: new-api_new-api-network
