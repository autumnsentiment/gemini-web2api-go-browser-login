<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Gemini Cookie Sync</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --fg:#e8eaed; --muted:#9aa0a6; --ok:#34a853; --bad:#ea4335; --warn:#fbbc04; --line:#2a2f3a; }
  * { box-sizing:border-box; }
  body { width:340px; margin:0; padding:14px; background:var(--bg); color:var(--fg);
         font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
  h1 { font-size:14px; margin:0 0 10px; display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); } .dot.warn { background:var(--warn); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:10px; }
  .row { display:flex; justify-content:space-between; gap:8px; margin:4px 0; }
  .row .k { color:var(--muted); flex:0 0 auto; }
  .row .v { text-align:right; word-break:break-all; }
  label.f { display:block; margin:8px 0 2px; color:var(--muted); }
  input[type=text], input[type=number] { width:100%; background:#0b0d11; border:1px solid var(--line);
       color:var(--fg); border-radius:7px; padding:6px 8px; font:inherit; }
  .chk { display:flex; align-items:center; gap:6px; margin:6px 0; }
  .btns { display:flex; gap:8px; margin-top:10px; }
  button { flex:1; background:#2b6cb0; border:0; color:#fff; border-radius:8px; padding:7px 8px;
       font:inherit; cursor:pointer; }
  button.sec { background:#2a2f3a; }
  button:disabled { opacity:.5; cursor:default; }
  .hint { color:var(--muted); font-size:11px; margin-top:8px; }
  .mono { font-family:ui-monospace,Consolas,monospace; font-size:11px; }
  .tabs { margin-top:4px; }
  .tab { display:flex; align-items:center; gap:8px; padding:7px 8px; border:1px solid var(--line);
         border-radius:8px; margin-bottom:6px; background:#0b0d11; }
  .tab.pinned { border-color:var(--ok); }
  .tab .info { flex:1; min-width:0; }
  .tab .t1 { display:flex; align-items:center; gap:6px; }
  .tab .t2 { color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden;
             text-overflow:ellipsis; }
  .tab .pick { flex:0 0 auto; background:#2a2f3a; padding:5px 8px; font-size:12px; }
  .pill { font-size:10px; padding:1px 6px; border-radius:999px; background:#2a2f3a; color:var(--muted); }
  .pill.ok { background:rgba(52,168,83,.18); color:var(--ok); }
  .pill.bad { background:rgba(234,67,53,.18); color:var(--bad); }
  .pill.pin { background:rgba(52,168,83,.18); color:var(--ok); }
  .empty { color:var(--muted); font-size:11px; padding:6px 2px; }
</style>
</head>
<body>
  <h1><span id="dot" class="dot"></span> Gemini Cookie Sync</h1>

  <div class="card">
    <div class="row"><span class="k">固定抓取页</span><span class="v" id="pinned">—</span></div>
    <div class="row"><span class="k">入池标识</span><span class="v mono" id="effprofile">—</span></div>
    <div class="tabs" id="tabs"></div>
    <div class="btns" style="margin-top:6px">
      <button id="btnRefreshTabs" class="sec">刷新页面列表</button>
      <button id="btnUnpin" class="sec">取消固定</button>
    </div>
  </div>

  <div class="card">
    <div class="row"><span class="k">登录状态</span><span class="v" id="login">—</span></div>
    <div class="row"><span class="k">Cookie 数</span><span class="v" id="ckcount">—</span></div>
    <div class="row"><span class="k">上次保活</span><span class="v" id="lastka">—</span></div>
    <div class="row"><span class="k">上次入池</span><span class="v" id="lastsync">—</span></div>
    <div class="row"><span class="k">入池结果</span><span class="v mono" id="syncdetail">—</span></div>
    <div class="row"><span class="k">上次状态同步</span><span class="v" id="laststatsync">—</span></div>
    <div class="row"><span class="k">状态同步结果</span><span class="v mono" id="statsyncdetail">—</span></div>
  </div>

  <div class="card">
    <label class="f">Profile 标识</label>
    <input type="text" id="profile" placeholder="本机浏览器">
    <label class="f">推送模式</label>
    <select id="pushMode" style="width:100%;background:#0b0d11;border:1px solid var(--line);color:inherit;border-radius:6px;padding:6px">
      <option value="service">服务端（远程服务器，推荐）</option>
      <option value="controller">控制器（同机/同网 Chromium）</option>
    </select>
    <label class="f">目标地址</label>
    <input type="text" id="controller" placeholder="http://192.168.5.246:8083">
    <label class="f">密钥（服务端模式填 API Key；控制器模式填共享密钥，可空）</label>
    <input type="text" id="token" placeholder="sk-gemini-...">

    <div class="chk"><input type="checkbox" id="enabled"><label for="enabled">启用扩展（自动保活/入池）</label></div>
    <div class="chk"><input type="checkbox" id="autoKeepalive"><label for="autoKeepalive">自动保活</label></div>
    <label class="f">保活间隔（分钟）</label>
    <input type="number" id="keepalivePeriodMin" min="1" step="1">
    <label class="f">入池间隔（分钟）</label>
    <input type="number" id="autoSyncMin" min="1" step="1">
    <label class="f">状态同步间隔（分钟）</label>
    <input type="number" id="statusPeriodMin" min="1" step="1" value="5">
    <label class="f">刷新冷却（秒，防风控）</label>
    <input type="number" id="refreshCooldownSec" min="10" step="5">
  </div>

  <div class="btns">
    <button id="btnSave" class="sec">保存</button>
    <button id="btnKa" class="sec">立即保活</button>
    <button id="btnStatusSync" class="sec">同步状态</button>
    <button id="btnSync">立即入池</button>
    <button id="btnSyncAll" class="sec">抓取全部账号</button>
  </div>
  <div class="hint">多账号登录时 Google 靠 URL 的 /u/N/ 路径区分账号（cookie 是共用的）。「抓取全部账号」会枚举本机所有已登录的 Google 账号逐个入池（第二个账号入池标识带 -u1 后缀）；也可以在列表里选单个页面点「读取此页」。抓取优先只读，会话失效时才刷新页面。</div>

  <script src="popup.js"></script>
</body>
</html>
